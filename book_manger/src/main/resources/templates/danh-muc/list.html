<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI'; background-color: #f5f5f5; }
        .navbar-custom { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .sidebar { background-color: #fff; padding: 20px; border-radius: 8px; }
        .sidebar a { display: block; padding: 12px 15px; margin: 5px 0; color: #333; text-decoration: none; border-radius: 5px; }
        .sidebar a:hover, .sidebar a.active { background-color: #667eea; color: white; }
        .content { background-color: #fff; padding: 20px; border-radius: 8px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; }
        .table { background: white; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">📚 Thư viện sách</a>
    </div>
</nav>

<div class="container-fluid mt-4 mb-4">
    <div class="row">
        <div class="col-md-2">
            <div class="sidebar">
                <h5 class="mb-4">Menu</h5>
                <a href="/">Dashboard</a>
                <a href="/sach">Quản lý sách</a>
                <a href="/phieu-muon">Phiếu mượn</a>
                <a href="/nguoi-dung">Người dùng</a>
                <a href="/danh-muc" class="active">Danh mục</a>
                <a href="/don-hang">Đơn hàng</a>
            </div>
        </div>

        <div class="col-md-10">
            <div class="content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>📂 Danh mục sách</h2>
                    <a href="/danh-muc/create" class="btn btn-primary">+ Thêm danh mục</a>
                </div>

                <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                    <span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Tên danh mục</th>
                            <th>Mô tả</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="dm : ${danhMucPage.content}">
                            <td th:text="${dm.id}">-</td>
                            <td th:text="${dm.tenDanhMuc}">-</td>
                            <td th:text="${dm.moTa}">-</td>
                            <td>
                                <a th:href="@{/danh-muc/{id}/edit(id=${dm.id})}" class="btn btn-sm btn-warning">Sửa</a>
                                <form th:action="@{/danh-muc/{id}/delete(id=${dm.id})}" method="post" style="display: inline;">
                                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Chắc chắn xóa?')">Xóa</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <nav>
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${!danhMucPage.hasPrevious() ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/danh-muc(page=${danhMucPage.number - 1})}">Trước</a>
                        </li>
                        <li class="page-item active">
                            <span class="page-link" th:text="${danhMucPage.number + 1}">1</span>
                        </li>
                        <li class="page-item" th:classappend="${!danhMucPage.hasNext() ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/danh-muc(page=${danhMucPage.number + 1})}">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
