<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết phiếu mượn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI'; background-color: #f5f5f5; }
        .navbar-custom { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .sidebar { background-color: #fff; padding: 20px; border-radius: 8px; }
        .sidebar a { display: block; padding: 12px 15px; margin: 5px 0; color: #333; text-decoration: none; border-radius: 5px; }
        .sidebar a:hover, .sidebar a.active { background-color: #667eea; color: white; }
        .content { background-color: #fff; padding: 20px; border-radius: 8px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; }
        .info-group { margin-bottom: 15px; }
        .info-label { font-weight: bold; color: #667eea; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">📚 Thư viện sách</a>
    </div>
</nav>

<div class="container-fluid mt-4 mb-4">
    <div class="row">
        <div class="col-md-2">
            <div class="sidebar">
                <h5 class="mb-4">Menu</h5>
                <a href="/">Dashboard</a>
                <a href="/sach">Quản lý sách</a>
                <a href="/phieu-muon" class="active">Phiếu mượn</a>
                <a href="/nguoi-dung">Người dùng</a>
                <a href="/danh-muc">Danh mục</a>
                <a href="/don-hang">Đơn hàng</a>
            </div>
        </div>

        <div class="col-md-10">
            <div class="content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>📋 Chi tiết phiếu mượn #<span th:text="${phieuMuon.id}">-</span></h2>
                    <a href="/phieu-muon" class="btn btn-secondary">← Quay lại</a>
                </div>

                <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                    <span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="info-group">
                            <span class="info-label">Người mượn:</span>
                            <span th:text="${phieuMuon.nguoiDungTen}">-</span>
                        </div>
                        <div class="info-group">
                            <span class="info-label">Ngày mượn:</span>
                            <span th:text="${#temporals.format(phieuMuon.ngayMuon, 'dd/MM/yyyy HH:mm')}">-</span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="info-group">
                            <span class="info-label">Hạn trả:</span>
                            <span th:text="${#temporals.format(phieuMuon.ngayHenTra, 'dd/MM/yyyy')}">-</span>
                        </div>
                        <div class="info-group">
                            <span class="info-label">Trạng thái:</span>
                            <span th:if="${phieuMuon.trangThai == 'ĐANG_MƯỢN'}" class="badge bg-primary" th:text="${phieuMuon.trangThai}">-</span>
                            <span th:if="${phieuMuon.trangThai == 'ĐÃ_TRẢ'}" class="badge bg-success" th:text="${phieuMuon.trangThai}">-</span>
                            <span th:if="${phieuMuon.trangThai == 'QUÁ_HẠN'}" class="badge bg-danger" th:text="${phieuMuon.trangThai}">-</span>
                        </div>
                    </div>
                </div>

                <h5 class="mb-3">Danh sách sách mượn:</h5>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                        <tr>
                            <th>Sách</th>
                            <th>Tình trạng</th>
                            <th>Ngày trả</th>
                            <th>Tiền phạt</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="chiTiet : ${phieuMuon.chiTietList}">
                            <td th:text="${chiTiet.sachTieu}">-</td>
                            <td th:text="${chiTiet.tinhTrangSach}">-</td>
                            <td th:text="${chiTiet.ngayTraThucTe != null ? #temporals.format(chiTiet.ngayTraThucTe, 'dd/MM/yyyy') : '-'}">-</td>
                            <td th:text="${chiTiet.tienPhat != null ? #numbers.formatDecimal(chiTiet.tienPhat, 1, 0) : '0'} + ' đ'">0 đ</td>
                            <td>
                                <form th:action="@{/phieu-muon/{phieuId}/tra/{sachId}(phieuId=${phieuMuon.id}, sachId=${chiTiet.sachId})}" method="post" style="display: inline;">
                                    <button th:if="${chiTiet.ngayTraThucTe == null}" type="submit" class="btn btn-sm btn-success">Trả</button>
                                </form>
                                <form th:action="@{/phieu-muon/{phieuId}/bao-mat/{sachId}(phieuId=${phieuMuon.id}, sachId=${chiTiet.sachId})}" method="post" style="display: inline;">
                                    <button th:if="${chiTiet.ngayTraThucTe == null}" type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Báo mất sách này?')">Mất</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="mt-4">
                    <a th:href="@{/phieu-muon/{id}/edit(id=${phieuMuon.id})}" th:if="${phieuMuon.trangThai == 'ĐANG_MƯỢN'}" class="btn btn-warning">Sửa</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
