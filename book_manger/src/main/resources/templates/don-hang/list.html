<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI'; background-color: #f5f5f5; }
        .navbar-custom { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .sidebar { background-color: #fff; padding: 20px; border-radius: 8px; }
        .sidebar a { display: block; padding: 12px 15px; margin: 5px 0; color: #333; text-decoration: none; border-radius: 5px; }
        .sidebar a:hover, .sidebar a.active { background-color: #667eea; color: white; }
        .content { background-color: #fff; padding: 20px; border-radius: 8px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; }
        .table { background: white; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">📚 Thư viện sách</a>
    </div>
</nav>

<div class="container-fluid mt-4 mb-4">
    <div class="row">
        <div class="col-md-2">
            <div class="sidebar">
                <h5 class="mb-4">Menu</h5>
                <a href="/">Dashboard</a>
                <a href="/sach">Quản lý sách</a>
                <a href="/phieu-muon">Phiếu mượn</a>
                <a href="/nguoi-dung">Người dùng</a>
                <a href="/danh-muc">Danh mục</a>
                <a href="/don-hang" class="active">Đơn hàng</a>
            </div>
        </div>

        <div class="col-md-10">
            <div class="content">
                <h2 class="mb-4">🛒 Đơn hàng</h2>

                <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                    <span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card mb-3">
                    <div class="card-body">
                        <form method="get" class="row g-2">
                            <div class="col-md-8">
                                <select name="trangThai" class="form-control">
                                    <option value="">-- Tất cả trạng thái --</option>
                                    <option value="CHỜ_XỬ_LÝ">Chờ xử lý</option>
                                    <option value="ĐANG_XỬ_LÝ">Đang xử lý</option>
                                    <option value="ĐANG_GIAO">Đang giao</option>
                                    <option value="HOÀN_THÀNH">Hoàn thành</option>
                                    <option value="ĐÃ_HỦY">Đã hủy</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <button type="submit" class="btn btn-primary w-100">Lọc</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Khách hàng</th>
                            <th>Ngày đặt</th>
                            <th>Tổng tiền</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="dh : ${donHangPage.content}">
                            <td th:text="${dh.id}">-</td>
                            <td th:text="${dh.nguoiDung.hoTen}">-</td>
                            <td th:text="${#temporals.format(dh.ngayDat, 'dd/MM/yyyy')}">-</td>
                            <td th:text="${#numbers.formatDecimal(dh.tongTien, 1, 0)} + ' đ'">0 đ</td>
                            <td>
                                <span th:if="${dh.trangThai == 'CHỜ_XỬ_LÝ'}" class="badge bg-warning" th:text="${dh.trangThai}">-</span>
                                <span th:if="${dh.trangThai == 'ĐANG_XỬ_LÝ'}" class="badge bg-info" th:text="${dh.trangThai}">-</span>
                                <span th:if="${dh.trangThai == 'ĐANG_GIAO'}" class="badge bg-primary" th:text="${dh.trangThai}">-</span>
                                <span th:if="${dh.trangThai == 'HOÀN_THÀNH'}" class="badge bg-success" th:text="${dh.trangThai}">-</span>
                                <span th:if="${dh.trangThai == 'ĐÃ_HỦY'}" class="badge bg-danger" th:text="${dh.trangThai}">-</span>
                            </td>
                            <td>
                                <a th:href="@{/don-hang/{id}(id=${dh.id})}" class="btn btn-sm btn-info">Xem</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <nav>
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${!donHangPage.hasPrevious() ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/don-hang(page=${donHangPage.number - 1})}">Trước</a>
                        </li>
                        <li class="page-item active">
                            <span class="page-link" th:text="${donHangPage.number + 1}">1</span>
                        </li>
                        <li class="page-item" th:classappend="${!donHangPage.hasNext() ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/don-hang(page=${donHangPage.number + 1})}">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
