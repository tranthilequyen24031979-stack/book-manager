<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI'; background-color: #f5f5f5; }
        .navbar-custom { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .sidebar { background-color: #fff; padding: 20px; border-radius: 8px; }
        .sidebar a { display: block; padding: 12px 15px; margin: 5px 0; color: #333; text-decoration: none; border-radius: 5px; }
        .sidebar a:hover, .sidebar a.active { background-color: #667eea; color: white; }
        .content { background-color: #fff; padding: 20px; border-radius: 8px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">📚 Thư viện sách</a>
    </div>
</nav>

<div class="container-fluid mt-4 mb-4">
    <div class="row">
        <div class="col-md-2">
            <div class="sidebar">
                <h5 class="mb-4">Menu</h5>
                <a href="/">Dashboard</a>
                <a href="/sach">Quản lý sách</a>
                <a href="/phieu-muon">Phiếu mượn</a>
                <a href="/nguoi-dung" class="active">Người dùng</a>
                <a href="/danh-muc">Danh mục</a>
                <a href="/don-hang">Đơn hàng</a>
            </div>
        </div>

        <div class="col-md-10">
            <div class="content">
                <h2 class="mb-4">✏️ Sửa thông tin người dùng</h2>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/nguoi-dung/{id}/update(id=${nguoiDung.id})}" th:object="${nguoiDung}" method="post">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Tên đăng nhập</label>
                                <input type="text" th:field="*{tenDangNhap}" class="form-control" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Họ tên <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{hoTen}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" th:field="*{email}" class="form-control">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Số điện thoại</label>
                                <input type="tel" th:field="*{soDienThoai}" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Vai trò</label>
                                <div>
                                    <span th:each="role : ${nguoiDung.vaiTroList}" class="badge bg-secondary" th:text="${role}">-</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Lưu</button>
                        <a href="/nguoi-dung" class="btn btn-secondary">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
